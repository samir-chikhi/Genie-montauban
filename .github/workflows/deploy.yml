name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Tous les jours à 5h17 UTC : régénère sitemap, llms.txt et miroirs
    # markdown, les committe, puis le site est redéployé — SEO à jour
    # sans aucune intervention.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  # write : le workflow committe les fichiers SEO régénérés dans la branche
  # (GitHub Pages sert le contenu de la branche — voir étape "Committer")
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis : les dates <lastmod> du sitemap
          # sont tirées du dernier commit de chaque page
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Propager le menu et le pied de page communs (_partials/)
        run: node tools/sync-partials.js

      - name: Régénérer les fichiers SEO (sitemap, llms.txt, miroirs md)
        run: |
          pip install --quiet beautifulsoup4 markdownify
          python generate_seo.py

      - name: Committer les fichiers SEO régénérés
        # GitHub Pages sert le contenu de la branche main : les fichiers
        # régénérés doivent donc être committés pour être publiés.
        # Un push via GITHUB_TOKEN ne redéclenche pas ce workflow (pas de boucle).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml llms.txt md/ *.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): régénération automatique (sitemap, llms.txt, miroirs md)"
            git push
          else
            echo "Aucun changement SEO à committer."
          fi

      - name: Garder le projet Supabase actif (évite la pause après 7 jours d'inactivité)
        run: |
          SB_URL=$(grep -oP '(?<=GENIE_SUPABASE_URL = ")[^"]+' assets/js/membres-config.js || true)
          SB_KEY=$(grep -oP '(?<=GENIE_SUPABASE_ANON_KEY = ")[^"]+' assets/js/membres-config.js || true)
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            curl -s -o /dev/null -w "Supabase ping: %{http_code}\n" "$SB_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
          else
            echo "Espace membres pas encore configuré (assets/js/membres-config.js vide) — étape ignorée."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Avant : tout le dépôt était publié (path: '.'), y compris le budget,
      # les notes internes, le code Apps Script, les archives… N'importe qui
      # pouvait les télécharger sur genie-montauban.fr. On ne publie plus
      # que ce qui est listé ici. Nouvelle page ou nouveau dossier public ?
      # L'ajouter à cette liste.
      - name: Préparer le dossier publié (fichiers publics uniquement)
        run: |
          mkdir -p _site
          cp *.html CNAME robots.txt sitemap.xml llms.txt favicon.png logo.png og-image.jpg \
             responsive-fixes.css Fiche_Adhesion_GENIE_2026.pdf _site/
          cp *.jpg _site/ 2>/dev/null || true
          # Clé IndexNow (publique par conception : prouve la propriété du site à Bing)
          cp 0b6e039c3c61e47127a598d2ef45fa5b.txt _site/
          cp "qr code avis google - génie.png" _site/ 2>/dev/null || true
          cp -r assets md _site/
          # Documents liés depuis les pages (statuts, PV, grille, règlement…)
          # Volontairement EXCLUS : 04_Perspectives_Strategie (budget),
          # 00_Synthese_Reunion, 06_Archives/Audit*, contrats .docx internes.
          mkdir -p _site/00_Preambule_Documents_Constitutifs _site/03_Site_Web_Tarifs _site/06_Archives
          cp 00_Preambule_Documents_Constitutifs/*.pdf _site/00_Preambule_Documents_Constitutifs/
          cp 03_Site_Web_Tarifs/*.pdf _site/03_Site_Web_Tarifs/
          cp 06_Archives/Savoir_vivre_au_Genie.pdf _site/06_Archives/
          touch _site/.nojekyll
          echo "Fichiers publiés : $(find _site -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prévenir Bing, Yahoo, Yandex… via IndexNow
        # Après un vrai déploiement (push ou lancement manuel, pas le cron
        # quotidien). La clé est publique : elle est servie à la racine du site.
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          KEY=0b6e039c3c61e47127a598d2ef45fa5b
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"genie-montauban.fr\",\"key\":\"$KEY\",\"keyLocation\":\"https://genie-montauban.fr/$KEY.txt\",\"urlList\":[$URLS]}"
